name: Terraform deployment 

on:  
  workflow_run:
    workflows: ["Docker Build and push"]
    types:
      - completed
    branches: [main]
  workflow_dispatch:  

permissions:
       id-token: write
       contents: read
       security-events: write
jobs:
    build:
        runs-on: ubuntu-latest
        if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' # Pipeline only runs if build/push succeded or manually
        defaults:
            run:
               working-directory: infra
        steps:

        - name: checkout code
          uses: actions/checkout@v2 

        - name: Configure AWS credentials
          uses: aws-actions/configure-aws-credentials@v6.2.3
          with:
            role-to-assume: ${{ vars.TERRAFORM_ROLE}}
            aws-region: eu-west-2

        -  name: Setup Terraform
           uses: hashicorp/setup-terraform@v4
        
        -  name: Setup TFlint
           uses: terraform-linters/setup-tflint@v4
           with:
              tflint_version: latest


        - name: Terraform linting

          run: |
              terraform init
              terraform fmt 
              terraform validate
              tflint --recursive --minimum-failure-severity=error


        -  name: Terraform plan
           run: terraform plan
           env:
            TF_VAR_cloudflare_token: ${{ secrets.CLOUDFLARE_TOKEN }}
            TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
            TF_VAR_image_tag: ${{ github.sha }}  
              
              
              
        - name: Run terraform apply
          env:
            TF_VAR_cloudflare_token: ${{ secrets.CLOUDFLARE_TOKEN }}
            TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
            TF_VAR_image_tag: ${{ github.sha }}
          run:
              terraform apply -auto-approve
        
        - name: Run Trivy vulnerability scanner in IaC mode
          uses: aquasecurity/trivy-action@v0.36.0
          with:
            scan-type: 'config'
            hide-progress: true
            format: 'sarif'
            output: 'trivy-results.sarif'
            exit-code: '0'   # continues and doesnt fail the job on failure, simply reports
            severity: 'CRITICAL,HIGH'
            
        - name: Upload Trivy results to GitHub Security tab
          uses: github/codeql-action/upload-sarif@v3
          if: always()
          with:
            sarif_file: trivy-results.sarif    